<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#C41E3A" />
      <stop offset="70%" stop-color="#800D1F" />
      <stop offset="100%" stop-color="#3F040C" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#E5B942" />
      <stop offset="100%" stop-color="#9E731B" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  
  <!-- Subtle decorative stars/snow -->
  <circle cx="100" cy="110" r="3" fill="#FFF" opacity="0.6" />
  <circle cx="410" cy="120" r="4" fill="#FFF" opacity="0.6" />
  <circle cx="80" cy="240" r="3" fill="#FFF" opacity="0.4" />
  <circle cx="430" cy="270" r="3" fill="#FFF" opacity="0.5" />
  <circle cx="130" cy="380" r="2.5" fill="#FFF" opacity="0.5" />
  <circle cx="390" cy="400" r="3" fill="#FFF" opacity="0.4" />

  <!-- Market Booth Roof / Base -->
  <path d="M 170 380 L 342 380 L 330 420 L 182 420 Z" fill="#78350F" />
  <rect x="236" y="380" width="40" height="40" fill="#92400E" />

  <!-- Christmas Tree Layers -->
  <!-- Bottom tier -->
  <polygon points="256,220 140,360 372,360" fill="url(#treeGrad)" />
  <!-- Middle tier -->
  <polygon points="256,160 170,270 342,270" fill="url(#treeGrad)" />
  <!-- Top tier -->
  <!-- Polygon points -->
  <polygon points="256,105 195,195 317,195" fill="url(#treeGrad)" />

  <!-- Snow Caps on Tree -->
  <path d="M 256 105 L 235 140 Q 256 148 277 140 Z" fill="url(#snowGrad)" opacity="0.9" />
  <path d="M 195 195 Q 220 205 256 195 Q 292 205 317 195 Q 300 215 256 210 Q 212 215 195 195 Z" fill="url(#snowGrad)" opacity="0.85" />
  <path d="M 170 270 Q 210 282 256 270 Q 302 282 342 270 Q 320 292 256 288 Q 192 292 170 270 Z" fill="url(#snowGrad)" opacity="0.85" />
  <path d="M 140 360 Q 195 375 256 360 Q 317 375 372 360 Q 345 385 256 380 Q 167 385 140 360 Z" fill="url(#snowGrad)" opacity="0.85" />

  <!-- Tree Baubles / Ornaments -->
  <circle cx="215" cy="245" r="7" fill="#EF4444" />
  <circle cx="295" cy="240" r="7" fill="url(#goldGrad)" />
  <circle cx="185" cy="330" r="8" fill="url(#goldGrad)" />
  <circle cx="256" cy="325" r="9" fill="#EF4444" />
  <circle cx="325" cy="335" r="8" fill="url(#goldGrad)" />
  <circle cx="256" cy="165" r="6" fill="#FBBF24" />

  <!-- Christmas Star at Top with Glow -->
  <g filter="url(#glow)">
    <polygon points="256,60 264,84 289,84 269,99 276,123 256,108 236,123 243,99 223,84 248,84" fill="url(#goldGrad)" />
    <circle cx="256" cy="92" r="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Market Banner Text at bottom -->
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFE885" text-anchor="middle" letter-spacing="3">WEIHNACHTSMARKT</text>
</svg>
